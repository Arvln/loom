openapi: 3.0.3
info:
  title: Article API
  version: 1.1.0
servers:
  - url: http://localhost:8080
paths:
  /articles:
    post:
      summary: Create a new article
      tags:
        - Articles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleInput'
      responses:
        '200':
          description: Created article
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseArticle'
    get:
      summary: Get articles (with optional cursor pagination and search)
      tags:
        - Articles
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: cursor
          schema:
            type: string
          description: ID of the last article from previous page
        - in: query
          name: search
          schema:
            type: string
          description: Search in title or content
        - in: query
          name: author
          schema:
            type: string
          description: Search by author username
      responses:
        '200':
          description: List of articles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseArticleList'

  /articles/{id}:
    get:
      summary: Get single article by ID
      tags:
        - Articles
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Article found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseArticle'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
    put:
      summary: Update an article by ID
      tags:
        - Articles
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleInput'
      responses:
        '200':
          description: Updated article
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseArticle'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
    delete:
      summary: Delete an article by ID
      tags:
        - Articles
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Article deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseMessage'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'

  /articles/upsert:
    post:
      summary: 新增或更新文章（Upsert Article）
      description: |
        若 `id` 未傳或為 0，會新增一篇狀態為 `draft` 的文章。
        若 `id` 已存在，則會更新該文章的內容。
        只有當 `status` 明確指定為 `"publish"` 時，才會更新狀態為發布。
      tags:
        - Articles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  example: 1
                  description: 若指定 id，則更新該文章；未指定則新增。
                title:
                  type: string
                  example: 我的第一篇文章
                content:
                  type: string
                  example: 這是文章內容。
                status:
                  type: string
                  nullable: true
                  enum: [draft, publish]
                  example: publish
                  description: 僅當指定為 publish 時會將文章設為發布。
              required:
                - title
                - content
      responses:
        '200':
          description: 成功（新增或更新文章）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: 文章新增成功（狀態：draft）
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      title:
                        type: string
                        example: 我的第一篇文章
                      content:
                        type: string
                        example: 這是文章內容。
                      status:
                        type: string
                        nullable: true
                        example: draft
                      created_at:
                        type: string
                        format: date-time
                        example: 2025-11-12T08:00:00Z
                      updated_at:
                        type: string
                        format: date-time
                        example: 2025-11-12T09:00:00Z
        '400':
          description: 請求參數錯誤
          content:
            application/json:
              examples:
                驗證錯誤:
                  value:
                    code: 400
                    msg: 傳入的 JSON 格式錯誤
                    data: null
        '500':
          description: 伺服器內部錯誤
          content:
            application/json:
              examples:
                新增或更新失敗:
                  value:
                    code: 500
                    msg: 新增失敗：資料庫錯誤
                    data: null

components:
  schemas:
    # === 基本資料結構 ===
    Article:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: object
          description: JSON structure content
        author_id:
          type: integer
          nullable: true
        author:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
        topics:
          type: array
          nullable: true
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
        # status:
        #   type: string
        #   enum:
        #     - draft
        #     - published
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ArticleInput:
      type: object
      properties:
        title:
          type: string
        content:
          type: object
        author_id:
          type: integer
          nullable: true
        topics:
          type: array
          nullable: true
          items:
            type: integer
        # status:
        #   type: string
        #   enum:
        #     - draft
        #     - published
      required:
        - title
        - content

    # === 統一回應格式 ===
    ResponseMessage:
      type: object
      properties:
        data:
          nullable: true
        message:
          type: string

    ResponseError:
      type: object
      properties:
        data:
          nullable: true
        message:
          type: string
          example: 錯誤訊息

    ResponseArticle:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Article'
        message:
          type: string
          example: 取得成功

    ResponseArticleList:
      type: object
      properties:
        data:
          type: object
          properties:
            limit:
              type: integer
            nextCursor:
              type: string
            prevCursor:
              type: string
            articles:
              type: array
              items:
                $ref: '#/components/schemas/Article'
        message:
          type: string
          example: 取得文章列表成功
